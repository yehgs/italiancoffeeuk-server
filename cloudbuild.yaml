# Cloud Build: build image -> push to Artifact Registry -> deploy a new Cloud Run revision.
# Runtime settings (env vars, secrets, scaling) live on the Cloud Run service itself and are
# kept across deploys; this file only changes the image.
substitutions:
  _REGION: europe-west1
  _SERVICE: italiancoffee-api
  _REPO: italiancoffee
  _CONTEXT_DIR: server   # set to "." if the API lives in its own repository
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    dir: ${_CONTEXT_DIR}
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}', '.']
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}']
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}
      - --region=${_REGION}
options:
  logging: CLOUD_LOGGING_ONLY
